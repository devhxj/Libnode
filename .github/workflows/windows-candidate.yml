name: Windows native candidate

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Exact commit or tag to build'
        required: true
        type: string
      architecture:
        description: 'Native Windows architecture to build and verify'
        required: false
        default: x64
        type: string
      native_build_run_id:
        description: 'Optional previous Windows candidate run to reuse without compiling V8'
        required: false
        default: ''
        type: string
      prepare_only:
        description: 'Download and verify pinned inputs only, for diagnosing source preparation'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
      architecture:
        description: 'Native Windows architecture to build and verify'
        required: false
        default: x64
        type: string
      native_build_run_id:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  windows-candidate:
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 360
    defaults:
      run:
        shell: cmd
    steps:
      - name: Validate requested architecture
        env:
          TARGET_ARCH: ${{ inputs.architecture || 'x64' }}
        run: |
          if "%TARGET_ARCH%"=="x64" exit /b 0
          if "%TARGET_ARCH%"=="arm64" exit /b 0
          echo Select x64 or arm64.
          exit /b 1
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Prepare tools
        if: ${{ inputs.native_build_run_id == '' }}
        run: |
          git config --global core.longpaths true
          rustup toolchain install 1.100.0 --profile minimal
          if /i "%PROCESSOR_ARCHITECTURE%"=="AMD64" choco install nasm --yes --no-progress
      - name: Verify native .NET runner architecture
        run: dotnet run --file scripts/csharp/verify-native-architecture.cs -- --rid win-${{ inputs.architecture || 'x64' }} --host
      - name: Download and verify locked inputs
        run: dotnet run --file scripts/csharp/prepare-libnode.cs -- --download-node
      - name: Identify native build cache
        id: build-cache
        run: echo image=%ImageVersion%>>%GITHUB_OUTPUT%
      - name: Restore Windows native intermediate files
        if: ${{ inputs.native_build_run_id == '' && !inputs.prepare_only }}
        id: restore-build
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/sources/node-*/
          key: windows-native-${{ inputs.architecture || 'x64' }}-${{ steps.build-cache.outputs.image }}-${{ hashFiles('native/libnode/source.lock.json') }}-${{ github.run_id }}
          restore-keys: windows-native-${{ inputs.architecture || 'x64' }}-${{ steps.build-cache.outputs.image }}-${{ hashFiles('native/libnode/source.lock.json') }}-
      - name: Prepare native source without compiling V8
        timeout-minutes: 15
        run: dotnet run --file scripts/csharp/build-libnode.cs -- --prepare-only --inputs-prepared
      - name: Preserve source preparation evidence
        if: ${{ inputs.prepare_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libnode-win-${{ inputs.architecture || 'x64' }}-inputs
          path: artifacts/inputs/
          if-no-files-found: error
          compression-level: 0
      - name: Build Windows shared library and harness
        id: native-build
        if: ${{ inputs.native_build_run_id == '' && !inputs.prepare_only }}
        env:
          RUSTUP_TOOLCHAIN: 1.100.0
        run: dotnet run --file scripts/csharp/build-windows-libnode.cs -- --source-prepared
      - name: Preserve Windows native intermediate files
        if: ${{ always() && inputs.native_build_run_id == '' && !inputs.prepare_only && steps.native-build.outcome != 'skipped' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/sources/node-*/
          key: ${{ steps.restore-build.outputs.cache-primary-key }}
      - name: Download prior Windows build
        if: ${{ inputs.native_build_run_id != '' && !inputs.prepare_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_BUILD_RUN_ID: ${{ inputs.native_build_run_id }}
        run: dotnet run --file scripts/csharp/wait-windows-build.cs -- "%NATIVE_BUILD_RUN_ID%" win-${{ inputs.architecture || 'x64' }}
      - name: Import artifact from prior Windows build
        if: ${{ inputs.native_build_run_id != '' && !inputs.prepare_only }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libnode-win-${{ inputs.architecture || 'x64' }}-build
          path: artifacts/native/win-${{ inputs.architecture || 'x64' }}
          run-id: ${{ inputs.native_build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Import Windows build without compiling V8
        if: ${{ inputs.native_build_run_id != '' && !inputs.prepare_only }}
        run: dotnet run --file scripts/csharp/import-windows-libnode.cs
      - name: Keep native build inputs before testing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libnode-win-${{ inputs.architecture || 'x64' }}-build
          if-no-files-found: warn
          path: artifacts/native/win-${{ inputs.architecture || 'x64' }}/
      - name: Native tests, Microsoft tests and NuGet consumer
        if: ${{ !inputs.prepare_only }}
        run: dotnet run --file scripts/csharp/verify-libnode.cs -- --inputs-prepared
      - name: Keep Windows verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libnode-win-${{ inputs.architecture || 'x64' }}-candidate
          if-no-files-found: warn
          path: |
            artifacts/native/win-${{ inputs.architecture || 'x64' }}/
            artifacts/verification/
            artifacts/windows-native-build.log
            artifacts/windows-source-prepare.log
