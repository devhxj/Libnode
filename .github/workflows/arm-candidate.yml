name: ARM64 native candidates

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Commit or branch to build and verify'
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install --yes g++-13 make python3 xz-utils libatomic1
      - name: Select Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Prepare locked native source
        run: dotnet run --file scripts/csharp/build-libnode.cs -- --prepare-only
      - name: Restore ARM64 intermediate files
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/sources/node-*/out
          key: linux-arm64-native-${{ hashFiles('native/libnode/source.lock.json') }}-${{ github.run_id }}
          restore-keys: linux-arm64-native-${{ hashFiles('native/libnode/source.lock.json') }}-
      - name: Build ARM64 library and harness
        id: build
        env:
          CC: gcc-13
          CXX: g++-13
          RUSTUP_TOOLCHAIN: 1.100.0
        run: dotnet run --file scripts/csharp/build-libnode.cs -- --jobs 4
      - name: Preserve ARM64 intermediate files
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/sources/node-*/out
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Native tests, Microsoft tests and actual ARM64 NuGet consumer
        run: dotnet run --file scripts/csharp/verify-libnode.cs
      - name: ARM64 addon and issue regressions
        run: dotnet run --file scripts/csharp/verify-upstream-issues.cs
      - name: Preserve ARM64 runtime and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libnode-linux-arm64-candidate
          if-no-files-found: warn
          path: |
            artifacts/native/linux-arm64/
            artifacts/verification/
            artifacts/upstream-issues/linux-arm64/
            artifacts/native-build.log

  windows-arm64:
    uses: ./.github/workflows/windows-candidate.yml
    with:
      release_ref: ${{ inputs.release_ref || github.sha }}
      architecture: arm64
