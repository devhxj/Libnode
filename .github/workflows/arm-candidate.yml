name: ARM64 native candidates

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Commit or branch to build and verify'
        required: false
        default: main
        type: string
      windows_build_run_id:
        description: 'Optional Windows ARM64 candidate run to reuse'
        required: false
        default: ''
        type: string
      linux_build_run_id:
        description: 'Optional ARM64 candidate run with a verified native ZIP to reuse'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
      windows_build_run_id:
        required: false
        default: ''
        type: string
      linux_build_run_id:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install --yes g++-13 make python3 xz-utils libatomic1
      - name: Verify native .NET runner architecture
        run: dotnet run --file scripts/csharp/verify-native-architecture.cs -- --rid linux-arm64 --host
      - name: Select Rust toolchain
        if: ${{ inputs.linux_build_run_id == '' }}
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Prepare locked native source
        if: ${{ inputs.linux_build_run_id == '' }}
        run: dotnet run --file scripts/csharp/build-libnode.cs -- --prepare-only
      - name: Restore ARM64 intermediate files
        if: ${{ inputs.linux_build_run_id == '' }}
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/sources/node-*/out
          key: linux-arm64-native-${{ hashFiles('native/libnode/source.lock.json') }}-${{ github.run_id }}
          restore-keys: linux-arm64-native-${{ hashFiles('native/libnode/source.lock.json') }}-
      - name: Build ARM64 library and harness
        if: ${{ inputs.linux_build_run_id == '' }}
        id: build
        env:
          CC: gcc-13
          CXX: g++-13
          RUSTUP_TOOLCHAIN: 1.100.0
        run: dotnet run --file scripts/csharp/build-libnode.cs -- --jobs 4
      - name: Preserve ARM64 intermediate files
        if: ${{ always() && inputs.linux_build_run_id == '' && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/sources/node-*/out
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Download previous ARM64 native bundle
        if: ${{ inputs.linux_build_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_BUILD_RUN_ID: ${{ inputs.linux_build_run_id }}
        run: dotnet run --file scripts/csharp/wait-linux-arm64-build.cs -- "$NATIVE_BUILD_RUN_ID"
      - name: Import artifact from previous Linux ARM64 run
        if: ${{ inputs.linux_build_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libnode-linux-arm64-candidate
          path: artifacts
          run-id: ${{ inputs.linux_build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect reusable ZIP
        if: ${{ inputs.linux_build_run_id != '' }}
        id: bundle
        run: |
          if test -f artifacts/local-build/libnode-linux-arm64-native.zip; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare fixtures for original cached ARM64 build
        if: ${{ inputs.linux_build_run_id != '' && steps.bundle.outputs.present != 'true' }}
        run: dotnet run --file scripts/csharp/build-libnode.cs -- --prepare-only
      - name: Restore original ARM64 harness and library
        if: ${{ inputs.linux_build_run_id != '' && steps.bundle.outputs.present != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/sources/node-*/out
          key: linux-arm64-native-${{ hashFiles('native/libnode/source.lock.json') }}-${{ inputs.linux_build_run_id }}
          fail-on-cache-miss: true
      - name: Import original cached ARM64 build without compiling V8
        if: ${{ inputs.linux_build_run_id != '' && steps.bundle.outputs.present != 'true' }}
        run: dotnet run --file scripts/csharp/build-libnode.cs -- --import-cached-build
      - name: Import ARM64 bundle and require fresh verification
        if: ${{ inputs.linux_build_run_id != '' && steps.bundle.outputs.present == 'true' }}
        run: |
          bundle_sha=$(sha256sum artifacts/local-build/libnode-linux-arm64-native.zip | cut -d ' ' -f 1)
          dotnet run --file scripts/csharp/native-bundle.cs -- import --rid linux-arm64 --sha256 "$bundle_sha" --reuse-locked-source
      - name: Native tests, Microsoft tests and actual ARM64 NuGet consumer
        run: dotnet run --file scripts/csharp/verify-libnode.cs
      - name: ARM64 addon and issue regressions
        run: dotnet run --file scripts/csharp/verify-upstream-issues.cs
      - name: Bundle verified ARM64 library and harness for reuse
        run: dotnet run --file scripts/csharp/native-bundle.cs -- pack --rid linux-arm64
      - name: Preserve ARM64 runtime and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libnode-linux-arm64-candidate
          if-no-files-found: warn
          path: |
            artifacts/native/linux-arm64/
            artifacts/verification/
            artifacts/upstream-issues/linux-arm64/
            artifacts/native-build.log
            artifacts/local-build/libnode-linux-arm64-native.zip

  windows-arm64:
    uses: ./.github/workflows/windows-candidate.yml
    with:
      release_ref: ${{ inputs.release_ref || github.sha }}
      architecture: arm64
      native_build_run_id: ${{ inputs.windows_build_run_id || '' }}
