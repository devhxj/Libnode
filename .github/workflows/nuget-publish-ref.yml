name: Publish NuGet From Ref

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Semantic version tag to verify and publish, for example v0.1.0'
        required: true
        type: string
      dry_run:
        description: 'Build, test and pack only; do not upload or create a release'
        required: false
        default: false
        type: boolean
      native_release_id:
        description: 'Optional draft release ID from native-bundle.cs upload; skips V8 compilation'
        required: false
        default: ''
        type: string
      native_archive_sha256:
        description: 'Required archive SHA256 when using a local native build'
        required: false
        default: ''
        type: string
      windows_build_run_id:
        description: 'Optional previous Windows candidate run ID; imports and retests without compiling V8'
        required: false
        default: ''
        type: string

      linux_arm64_build_run_id:
        description: 'Optional verified Linux ARM64 candidate run to reuse'
        required: false
        default: ''
        type: string
      windows_arm64_build_run_id:
        description: 'Optional Windows ARM64 candidate run to reuse'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: libnode-release-${{ inputs.release_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Read authenticated draft-release build inputs.
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      package_version: ${{ steps.release.outputs.package_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.release_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Verify release tag and curated notes
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_ref || github.ref_name }}
        run: dotnet run --file scripts/csharp/release-notes.cs -- --tag "$RELEASE_TAG" --require-tag --output artifacts/release-notes.md --github-output "$GITHUB_OUTPUT"
      - name: Validate local input selection
        env:
          NATIVE_RELEASE_ID: ${{ inputs.native_release_id }}
          NATIVE_ARCHIVE_SHA256: ${{ inputs.native_archive_sha256 }}
        run: |
          if [[ -z "$NATIVE_RELEASE_ID" && -n "$NATIVE_ARCHIVE_SHA256" ]]; then
            echo 'native_release_id and native_archive_sha256 must be supplied together' >&2
            exit 1
          fi
      - name: Download and authenticate local native bundle
        if: ${{ inputs.native_release_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_RELEASE_ID: ${{ inputs.native_release_id }}
          NATIVE_ARCHIVE_SHA256: ${{ inputs.native_archive_sha256 }}
        run: dotnet run --file scripts/csharp/native-bundle.cs -- download --release-id "$NATIVE_RELEASE_ID" --sha256 "$NATIVE_ARCHIVE_SHA256"
      - name: Pass local native bundle to verification
        if: ${{ inputs.native_release_id != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libnode-native-input
          path: artifacts/local-build/libnode-linux-x64-native.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libnode-release-notes
          path: artifacts/release-notes.md
          if-no-files-found: error

  verify:
    needs: release
    uses: ./.github/workflows/native-candidate.yml
    with:
      release_ref: ${{ needs.release.outputs.commit }}
      package_version: ${{ needs.release.outputs.package_version }}
      use_prebuilt: ${{ inputs.native_release_id != '' }}
      native_archive_sha256: ${{ inputs.native_archive_sha256 || '' }}

  verify-windows:
    needs: release
    uses: ./.github/workflows/windows-candidate.yml
    with:
      release_ref: ${{ needs.release.outputs.commit }}
      native_build_run_id: ${{ inputs.windows_build_run_id || '' }}

  verify-arm64:
    needs: release
    uses: ./.github/workflows/arm-candidate.yml
    with:
      release_ref: ${{ needs.release.outputs.commit }}
      linux_build_run_id: ${{ inputs.linux_arm64_build_run_id || '' }}
      windows_build_run_id: ${{ inputs.windows_arm64_build_run_id || '' }}

  package:
    needs: [release, verify, verify-windows, verify-arm64]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.verify.result == 'success' && needs.verify-windows.result == 'success' && needs.verify-arm64.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libnode-linux-x64-candidate
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libnode-win-x64-candidate
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libnode-linux-arm64-candidate
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libnode-win-arm64-candidate
          path: artifacts
      - name: Pack and verify Linux and Windows release closure
        env:
          PACKAGE_VERSION: ${{ needs.release.outputs.package_version }}
        run: dotnet run --file scripts/csharp/publish-nuget.cs -- --package-version "$PACKAGE_VERSION" --skip-push
      - name: Release tooling regression checks
        run: dotnet run --file scripts/csharp/verify-release.cs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libnode-release-packages
          if-no-files-found: error
          path: artifacts/release/packages/*

  verify-windows-package:
    needs: [release, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libnode-release-packages
          path: artifacts/release/packages
      - name: Verify actual release metapackage on Windows
        env:
          PACKAGE_VERSION: ${{ needs.release.outputs.package_version }}
        run: dotnet run --file scripts/csharp/verify-release-consumer.cs -- --package-version "%PACKAGE_VERSION%"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libnode-${{ matrix.rid }}-release-consumer
          path: artifacts/release/packages/release-consumer-${{ matrix.rid }}.json
          if-no-files-found: error

  verify-linux-arm64-package:
    needs: [release, package]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libnode-release-packages
          path: artifacts/release/packages
      - name: Verify actual release metapackage on Linux ARM64
        env:
          PACKAGE_VERSION: ${{ needs.release.outputs.package_version }}
        run: dotnet run --file scripts/csharp/verify-release-consumer.cs -- --package-version "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libnode-linux-arm64-release-consumer
          path: artifacts/release/packages/release-consumer-linux-arm64.json
          if-no-files-found: error

  publish:
    needs: [release, verify, verify-windows, verify-arm64, package, verify-windows-package, verify-linux-arm64-package]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.verify.result == 'success' && needs.verify-windows.result == 'success' && needs.package.result == 'success' && needs.verify-windows-package.result == 'success' && needs.verify-arm64.result == 'success' && needs.verify-linux-arm64-package.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libnode-release-packages
          path: artifacts/release/packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libnode-release-notes
          path: artifacts/release
      - name: Verify exact release artifacts before authentication
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: dotnet run --file scripts/csharp/publish-release.cs -- --tag "$RELEASE_TAG" --verify-only
      - name: NuGet trusted publishing login
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages and GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run --file scripts/csharp/publish-release.cs -- --tag "$RELEASE_TAG"
